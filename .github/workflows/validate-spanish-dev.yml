name: Validate Gboard Spanish (dev)

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/validate-spanish-dev.yml"
      - "extensions/extension/**"
      - "patches/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: gboard-spanish-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test localization and build Morphe bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_ACTOR: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable wrapper
        run: chmod +x ./gradlew

      - name: Verify Spanish XML source contract
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path("extensions/extension/src/main/settings-text")
          master = ET.parse(root / "gboard_settings_text.xml").getroot()
          overlay = ET.parse(root / "gboard_settings_text_es.xml").getroot()
          assert overlay.tag == "settings-text" and overlay.attrib.get("locale") == "es"
          english = {el.attrib["name"]: el for el in master}
          keys = set()
          formats = lambda s: sorted(re.findall(r"%(?:\\d+\\$)?[a-zA-Z]", s))
          for entry in overlay:
              name = entry.attrib["name"]
              assert name in english and name not in keys, name
              keys.add(name)
              original = english[name]
              assert entry.tag == original.tag, name
              if entry.tag == "string":
                  default = original.find("translation[@locale='en']")
                  assert default is not None
                  assert formats(entry.text or "") == formats(default.text or ""), name
              else:
                  default_items = {i.attrib["quantity"]: i for i in original}
                  for item in entry:
                      assert item.attrib["quantity"] in default_items
                      default = default_items[item.attrib["quantity"]].find(
                          "translation[@locale='en']")
                      assert default is not None
                      assert formats(item.text or "") == formats(default.text or ""), name
          assert len(keys) >= 100, len(keys)
          assert overlay.find(".//string[@name='gboard_patches_language_spanish_label']") is not None
          print(f"Valid Spanish overrides: {len(keys)} strings/plural groups")
          PY

      - name: Generate and validate Spanish settings resources
        run: ./gradlew --no-daemon :extensions:extension:generateSettingsText --stacktrace

      - name: Run extension localization and regression tests
        run: ./gradlew --no-daemon :extensions:extension:testDebugUnitTest --stacktrace

      - name: Build Gboard Morphe patch bundle and verify metadata
        run: ./gradlew --no-daemon :patches:buildAndroid :patches:generatePatchesList --stacktrace

      - name: Upload patched bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gboard-patches-spanish-dev
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gboard-spanish-test-reports
          path: |
            extensions/extension/build/test-results/
            extensions/extension/build/reports/tests/
            extensions/extension/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7
